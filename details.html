            { type: 'h2', text: 'كيفية اختيار الديكور الأنسب لمساحتك' },
            { type: 'p', text: 'عند اختيار ديكورات بديل الشيبورد لمساحتك، ننصح بمراعاة عدة عوامل: حجم الغرفة وارتفاع السقف، الديكور العام للمكان، الإضاءة المتوفرة، الوظيفة المطلوبة من الديكور، والميزانية المتاحة. ننصح دائماً بالاستعانة بفريق متخصص لضمان تحقيق أفضل نتيجة.' },
            { type: 'h2', text: 'ديكورات بديل الشيبورد مع أبو حور' },
            { type: 'p', text: 'في شركة أبو حور، نقدم خدمة تصميم وتركيب ديكورات بديل الشيبورد بأحدث التصاميم وأجود الخامات. فريقنا من المصممين والفنيين يحوّل رؤيتك إلى واقع ملموس بأدق التفاصيل، مع ضمان على العمل والمنتج. نوفّر تصاميم ثلاثية الأبعاد قبل التنفيذ لضمان رضاك التام. تواصل معنا اليوم للحصول على استشارة مجانية.' }
          ]
        }
      };

      function getQueryParam(name) {
        var params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      function renderContent(contentArr) {
        var html = '';
        contentArr.forEach(function (block) {
          if (block.type === 'p') {
            html += '<p>' + block.text + '</p>';
          } else if (block.type === 'h2') {
            html += '<h2>' + block.text + '</h2>';
          } else if (block.type === 'h3') {
            html += '<h3>' + block.text + '</h3>';
          } else if (block.type === 'ul') {
            html += '<ul>';
            block.items.forEach(function (item) {
              html += '<li>' + item + '</li>';
            });
            html += '</ul>';
          }
        });
        return html;
      }

      function renderTags(tags) {
        var html = '';
        tags.forEach(function (tag) {
          html += '<span>' + tag + '</span>';
        });
        return html;
      }

      var id = getQueryParam('id') || '1';
      var article = articles[id] || articles['1'];

      document.title = article.title + ' | أبو حور';
      document.getElementById('articleCategory').textContent = article.category;
      document.getElementById('articleTitle').textContent = article.title;
      document.getElementById('articleDate').textContent = article.date;
      document.getElementById('articleContent').innerHTML = renderContent(article.content);
      document.getElementById('articleTags').innerHTML = renderTags(article.tags);

      var img = document.getElementById('articleImage');
      if (img.getAttribute('src') === '' || !img.getAttribute('src')) {
        img.style.display = 'none';
      }

      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('revealed');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in').forEach(function (el) {
          observer.observe(el);
        });
      } else {
        document.querySelectorAll('.fade-in').forEach(function (el) {
          el.classList.add('revealed');
        });
      }
    })();
  </script>
</body>
</html>
